# WebDesk 配置文件（Rust 2.0 版，也可直接在 GUI 中修改）
# 服务固定同时监听 IPv4（0.0.0.0）与 IPv6（[::]）
[server]
# 监听端口 (1-65535)
port = 8765
# 访问密码哈希（PBKDF2-SHA256，留空表示不需要密码）
password_hash = 
# 兼容旧版明文密码，建议清空并改用上面的哈希
password = 

[performance]
# 最大帧率
fps = 15
# 差分瓦片大小（像素）
tile_size = 64
# JPEG 压缩质量 (10-95)
quality = 75

[general]
# 开机自动启动（当前用户，免管理员）
autostart = false
# 关闭窗口时最小化到系统托盘
minimize_to_tray = true
# 启动后直接最小化到托盘
start_minimized = false
# 服务启动后自动打开浏览器
open_browser = false
