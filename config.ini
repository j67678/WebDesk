# WebDesk 配置文件（Rust 2.0 版，也可直接在 GUI 中修改）
# 服务固定同时监听 IPv4（0.0.0.0）与 IPv6（[::]）
[server]
# 监听端口 (1-65535)
port = 8765
# 访问密码哈希（PBKDF2-SHA256，留空表示不需要密码）
password_hash = 
# 兼容旧版明文密码，建议清空并改用上面的哈希
password = 

[performance]
# 最大帧率（H.264 编码节拍）；局域网拖动窗口建议 30，弱网可调低
fps = 30
# 以下两项为旧版 JPEG 差分遗留配置，WebRTC 迁移后不再生效
tile_size = 64
quality = 75
# H.264 目标码率 kbps（300-20000；弱网下客户端会自动请求下调）
bitrate_kbps = 2500
# 弱网码率下限 kbps；过低会导致字体模糊，服务端强制不下探（1080p 建议 >= 1500）
min_bitrate_kbps = 1500

[general]
# 开机自动启动（当前用户，免管理员）
autostart = false
# 关闭窗口时最小化到系统托盘
minimize_to_tray = true
# 启动后直接最小化到托盘
start_minimized = false
# 服务启动后自动打开浏览器
open_browser = false
