<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WebDesk · 远程桌面</title>
<style>
  :root {
    --bg: #0d0d0d;
    --panel: #161b26;
    --panel2: #1a1a2e;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #4f8ef7;
    --green: #3fb950;
    --red: #f85149;
    --tap: 44px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }

  body { display: flex; flex-direction: column; padding-top: var(--safe-t); }

  body.fullscreen-mode #toolbar,
  body.fullscreen-mode #touchbar { display: none !important; }

  /* ── 顶部工具栏 ───────────────────────────────────────────────── */
  #toolbar {
    background: linear-gradient(135deg, var(--panel2) 0%, #16213e 100%);
    border-bottom: 1px solid #2a2a4a;
    padding: 7px 14px;
    padding-left: calc(14px + var(--safe-l));
    padding-right: calc(14px + var(--safe-r));
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap; flex-shrink: 0; z-index: 100;
  }
  #toolbar .logo {
    font-size: 17px; font-weight: 700; color: #7c9ef5;
    letter-spacing: -.5px; white-space: nowrap;
  }
  #toolbar .logo span { color: #a78bfa; }

  .btn {
    min-height: 34px; padding: 6px 14px; border-radius: 8px; border: none;
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: background .15s, transform .1s; white-space: nowrap;
  }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-primary { background: #1f6feb; color: #fff; }
  .btn-primary:hover { background: #388bfd; }
  .btn-danger { background: #da3633; color: #fff; }
  .btn-danger:hover { background: var(--red); }
  .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid var(--border); }
  .btn-secondary:hover { background: #30363d; }
  .btn-toggle.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }

  #status-dot {
    width: 9px; height: 9px; border-radius: 50%; background: #444;
    transition: background .3s; flex-shrink: 0;
  }
  #status-dot.connecting { background: #f0ad4e; animation: pulse 1s infinite; }
  #status-dot.connected  { background: var(--green); }
  #status-dot.error      { background: var(--red); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

  #status-text { font-size: 12px; color: var(--muted); min-width: 70px; }
  #stats { font-size: 11px; color: #6e7681; margin-left: auto; display: flex; gap: 12px; }
  #stats span { white-space: nowrap; }
  .spacer { margin-left: auto; }

  /* ── 主视图 ───────────────────────────────────────────────────── */
  #viewport {
    flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center;
    background: #080808; position: relative; min-height: 0;
    overscroll-behavior: contain;
  }
  body.fullscreen-mode #viewport { position: fixed; inset: 0; width: 100vw; height: 100vh; overflow: hidden; }
  #canvas-wrapper { position: relative; display: inline-block; flex-shrink: 0; margin: auto; cursor: none; touch-action: none; }
  #screen-video { display: block; background: #111; touch-action: none; object-fit: fill; }
  #remote-cursor { position: absolute; width: 16px; height: 16px; pointer-events: none; z-index: 10; transform: translate(-2px,-2px); }

  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(0,0,0,.86); z-index: 50; padding: 24px; text-align: center;
  }
  #overlay.hidden { display: none; }
  #overlay .icon { font-size: 56px; opacity: .55; }
  #overlay .title { font-size: 21px; font-weight: 600; color: #c9d1d9; }
  #overlay .subtitle { font-size: 13px; color: #6e7681; max-width: 420px; line-height: 1.7; }

  #notif {
    position: fixed; bottom: calc(18px + var(--safe-b)); left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 20px; font-size: 13px; color: var(--text); z-index: 300;
    opacity: 0; pointer-events: none; transition: opacity .3s; max-width: 90vw; text-align: center;
  }
  #notif.show { opacity: 1; }

  /* ── 密码对话框 ───────────────────────────────────────────────── */
  #auth-dialog {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.9); z-index: 999; padding: 16px;
  }
  #auth-dialog.show { display: flex; }
  #auth-box {
    background: linear-gradient(135deg, var(--panel2), #16213e);
    border: 1px solid #2a2a4a; border-radius: 14px; padding: 24px;
    width: min(360px, 92vw); box-shadow: 0 8px 32px rgba(0,0,0,.6);
  }
  #auth-box h3 { font-size: 18px; color: var(--text); text-align: center; margin-bottom: 16px; }
  #auth-box input[type="password"], #auth-box input[type="text"] {
    width: 100%; background: #0d1117; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 12px; font-size: 16px; outline: none; margin-bottom: 12px;
    -webkit-user-select: text; user-select: text;
  }
  #auth-box input:focus { border-color: var(--accent); }
  #auth-box .auth-buttons { display: flex; gap: 10px; }
  #auth-box .auth-buttons .btn { flex: 1; min-height: var(--tap); font-size: 15px; }
  #auth-error { color: var(--red); font-size: 13px; margin-bottom: 10px; text-align: center; min-height: 18px; }
  .remember-password { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .remember-password input { width: 18px; height: 18px; }

  /* ── 触屏工具条（仅小屏 / 粗指针设备显示）───────────────────────── */
  #touchbar { display: none; flex-shrink: 0; z-index: 110;
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 6px 8px calc(6px + var(--safe-b));
    padding-left: calc(8px + var(--safe-l)); padding-right: calc(8px + var(--safe-r));
  }
  .touch-row { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; }
  .touch-row::-webkit-scrollbar { display: none; }
  .touch-row + .touch-row { margin-top: 6px; }
  .tbtn {
    flex: 0 0 auto; min-width: var(--tap); min-height: var(--tap);
    padding: 0 12px; border-radius: 10px; border: 1px solid var(--border);
    background: #21262d; color: var(--text); font-size: 14px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .tbtn:active { background: #30363d; }
  .tbtn.on { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  #text-input {
    flex: 1 1 120px; min-width: 100px; min-height: var(--tap);
    background: #0d1117; border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); padding: 0 10px; font-size: 16px; outline: none;
    -webkit-user-select: text; user-select: text;
  }
  #text-input:focus { border-color: var(--accent); }
  #kbd-hidden { position: fixed; opacity: 0; width: 1px; height: 1px; left: -9999px; }

  #kbd-panel {
    display: none; position: fixed; z-index: 200;
    bottom: calc(64px + var(--safe-b)); left: 8px; right: 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  #kbd-panel.show { display: block; }
  #kbd-panel .key-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  #kbd-panel .tbtn { min-width: 52px; }

  /* ── 小屏适配 ─────────────────────────────────────────────────── */
  @media (max-width: 760px), (pointer: coarse) {
    #toolbar { gap: 7px; padding: 6px 8px; }
    #toolbar .logo, #stats, label { display: none; }
    .btn { min-height: var(--tap); padding: 0 14px; font-size: 14px; }
    #status-text { font-size: 12px; }
    #touchbar { display: block; }
    #remote-cursor { display: none; }
    #overlay .icon { font-size: 44px; }
    #overlay .title { font-size: 18px; }
    #kbd-panel { bottom: calc(118px + var(--safe-b)); }
  }
  @media (max-width: 420px) {
    #toolbar .btn { padding: 0 10px; }
    #toolbar .btn-secondary span.short { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div id="toolbar">
  <div class="logo">🖥️ Web<span>Desk</span></div>

  <button class="btn btn-primary" id="btn-connect">连接</button>
  <button class="btn btn-danger" id="btn-disconnect" disabled>断开</button>
  <button class="btn btn-secondary" id="btn-refresh" title="强制全屏刷新">🔄 <span class="short">刷新</span></button>
  <button class="btn btn-secondary" id="btn-fullscreen" title="全屏">⛶ <span class="short">全屏</span></button>

  <div class="spacer"></div>
  <div id="status-dot"></div>
  <span id="status-text">未连接</span>
  <div id="stats">
    <span id="stat-fps">FPS: -</span>
    <span id="stat-tiles">Tiles: -</span>
    <span id="stat-bw">BW: -</span>
    <span id="stat-latency">延迟: -</span>
  </div>
</div>

<div id="viewport">
  <div id="canvas-wrapper">
    <video id="screen-video" autoplay playsinline muted></video>
    <svg id="remote-cursor" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="1,1 1,13 4,10 7,15 9,14 6,9 10,9" fill="white" stroke="black" stroke-width="1"/>
    </svg>
  </div>
  <div id="overlay">
    <div class="icon">🖥️</div>
    <div class="title">远程桌面</div>
    <div class="subtitle">正在自动连接当前服务端…<br>触屏：单指轻点＝单击，拖动＝移动光标，长按＝右键，双指＝缩放 / 滚动。</div>
  </div>
</div>

<!-- 触屏工具条 -->
<div id="touchbar">
  <div class="touch-row">
    <button class="tbtn on" id="t-mode" title="切换点击 / 拖动模式">👆 点击</button>
    <button class="tbtn" id="t-kbd" title="虚拟键盘">⌨️ 键盘</button>
    <button class="tbtn" id="t-paste" title="粘贴文本">📋 粘贴</button>
    <button class="tbtn" id="t-zoom-out" title="缩小">➖</button>
    <button class="tbtn" id="t-zoom-in" title="放大">➕</button>
    <button class="tbtn" id="t-fit" title="适应屏幕">⤢ 适应</button>
  </div>
  <div class="touch-row">
    <input type="text" id="text-input" placeholder="输入文字（支持中文）" autocomplete="off" spellcheck="false">
    <button class="tbtn" id="t-send" title="发送文字">发送</button>
  </div>
</div>

<!-- 隐藏输入框：用于唤起手机软键盘 -->
<input type="text" id="kbd-hidden" autocomplete="off" spellcheck="false" aria-hidden="true">

<!-- 虚拟快捷键面板 -->
<div id="kbd-panel">
  <div class="key-grid" id="key-grid"></div>
</div>

<div id="notif"></div>

<div id="auth-dialog">
  <div id="auth-box">
    <h3>🔒 需要密码验证</h3>
    <div id="auth-error"></div>
    <input type="password" id="auth-password" placeholder="请输入访问密码" autocomplete="off">
    <label class="remember-password"><input type="checkbox" id="remember-password"><span>记住密码</span></label>
    <div class="auth-buttons">
      <button class="btn btn-secondary" id="auth-cancel">取消</button>
      <button class="btn btn-primary" id="auth-submit">确认</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ── 状态 ───────────────────────────────────────────────────────────
let ws = null;
let pc = null;                          // RTCPeerConnection：仅 host candidate，IP 直连
let remoteWidth = 1920, remoteHeight = 1080;
let zoom = 1.0, manualZoom = false;
let isConnected = false, requireAuth = false;
let touchMode = 'tap';                  // tap | drag
let frameCount = 0, byteCount = 0;
let pendingMove = null, moveScheduled = false, lastKeyframeRequest = 0;
// 弱网自适应状态：从 getStats() 累计丢包/收包，周期性建议服务端码率
let lastRtcStats = { frames: 0, bytes: 0, lost: 0, received: 0 };
let targetBitrateKbps = 2500, lastAdaptAt = 0;
// 码率下限由服务端下发；低于该值桌面文字会明显模糊，弱网时宁可掉帧也不继续下探
let minBitrateKbps = 1500, bitrateAtFloor = false;
// 心跳对账：本端仍按下的键 / 鼠标键。服务端据此做差集释放。
const pressedKeys = new Map(), pressedButtons = new Set();
const keyId = (key, code) => (code || '') + '|' + key;
function releaseAllLocal() {
  pressedKeys.clear();
  pressedButtons.clear();
  send({ type: 'release_all' });
}

// 关键帧请求去抖：弱网丢包时请服务端立刻发 IDR
function requestKeyframe() {
  const now = performance.now();
  if (now - lastKeyframeRequest > 800) {
    lastKeyframeRequest = now;
    send({ type: 'keyframe' });
  }
}
let lastStatTime = performance.now(), latencyMs = 0, pingStart = 0;
let statTimer = null, pingTimer = null, notifTimer = null;
let lastMoveSent = 0;

const $ = id => document.getElementById(id);
const video = $('screen-video');
const overlay = $('overlay'), viewport = $('viewport'), wrapper = $('canvas-wrapper');
const authDialog = $('auth-dialog'), authPassword = $('auth-password'), authError = $('auth-error');
const rememberPassword = $('remember-password'), remoteCursor = $('remote-cursor');

// ── 本地存储 ───────────────────────────────────────────────────────
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

// ── 通知 / 状态 ────────────────────────────────────────────────────
function notify(msg) {
  const el = $('notif');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
function setStatus(state, text) {
  $('status-dot').className = state;
  $('status-text').textContent = text;
}
function vibrate(ms) { if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }

// ── 连接管理 ───────────────────────────────────────────────────────
function wsUrl() {
  // 页面由服务端提供，直接连接当前页面的主机与端口（IPv6 已带方括号）
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${proto}//${location.host}/ws`;
}

let reconnectAttempts = 0, reconnectTimer = null, userDisconnect = false;

function connect() {
  const url = wsUrl();
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (ws) { try { ws.close(); } catch (e) {} }
  closePeer();
  userDisconnect = false;
  setStatus('connecting', '连接中…');
  notify('正在连接 ' + url);
  ws = new WebSocket(url);

  ws.onopen = () => { reconnectAttempts = 0; setStatus('connecting', '信令已连接'); };
  ws.onclose = e => {
    isConnected = false; requireAuth = false;
    closePeer();
    setStatus('error', `已断开 (${e.code})`);
    overlay.classList.remove('hidden');
    authDialog.classList.remove('show');
    $('btn-connect').disabled = false; $('btn-disconnect').disabled = true;
    stopTimers();
    // 异常断开（非用户主动）自动重连，弱网抖动后自恢复；指数退避上限 10 秒
    if (!userDisconnect && reconnectAttempts < 8) {
      const delay = Math.min(10000, 800 * Math.pow(1.6, reconnectAttempts++));
      setStatus('connecting', `重连中（${Math.round(delay / 1000)}s）…`);
      reconnectTimer = setTimeout(connect, delay);
    }
  };
  ws.onerror = () => { setStatus('error', '连接错误'); notify('⚠️ 信令连接失败，请检查服务端'); };
  ws.onmessage = onMessage;
}

function closePeer() {
  if (pc) {
    try { pc.close(); } catch (e) {}
    pc = null;
  }
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
    video.srcObject = null;
  }
}

function disconnect() {
  userDisconnect = true;
  reconnectAttempts = 0;
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (ws) ws.close(1000, 'user disconnect');
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// ── 认证 ───────────────────────────────────────────────────────────
function showAuthDialog() {
  authDialog.classList.add('show'); authError.textContent = '';
  if (store.get('rdp_remember', 'false') === 'true') {
    const saved = store.get('rdp_password', '');
    authPassword.value = saved; rememberPassword.checked = true;
    if (saved) { setTimeout(submitAuth, 120); return; }
  } else {
    authPassword.value = ''; rememberPassword.checked = false;
  }
  setTimeout(() => authPassword.focus(), 100);
}
function submitAuth() {
  const pw = authPassword.value;
  if (!pw) { authError.textContent = '请输入密码'; return; }
  authError.textContent = '验证中…';
  send({ type: 'auth', password: pw });
  if (rememberPassword.checked) { store.set('rdp_password', pw); store.set('rdp_remember', 'true'); }
  else { store.del('rdp_password'); store.set('rdp_remember', 'false'); }
}

// ── 消息处理 ───────────────────────────────────────────────────────
function onMessage(evt) {
  let d; try { d = JSON.parse(evt.data); } catch (e) { return; }

  if (d.type === 'auth_result') {
    if (d.success) {
      authError.textContent = ''; authDialog.classList.remove('show');
      notify('密码验证成功 ✓');
      startWebRtc();
    } else {
      authError.textContent = d.message || '密码错误';
      authPassword.value = ''; authPassword.focus();
      store.del('rdp_password'); store.set('rdp_remember', 'false');
      rememberPassword.checked = false; vibrate(120);
    }
    return;
  }

  if (d.type === 'init') {
    if (d.require_auth) {
      requireAuth = true; showAuthDialog(); return;   // 未认证时不建立 WebRTC
    }
    requireAuth = false;
    if (Number.isFinite(d.min_bitrate_kbps) && d.min_bitrate_kbps > 0) {
      minBitrateKbps = d.min_bitrate_kbps;
      if (targetBitrateKbps < minBitrateKbps) targetBitrateKbps = minBitrateKbps;
    }
    startWebRtc();
    return;
  }

  if (d.type === 'answer') {
    if (!pc) { notify('尚未创建 WebRTC 连接'); return; }
    pc.setRemoteDescription({ type: 'answer', sdp: d.sdp })
      .then(() => setStatus('connected', 'WebRTC 已协商'))
      .catch(e => { setStatus('error', 'SDP 协商失败'); notify('⚠️ SDP 协商失败: ' + e); });
    return;
  }

  if (d.type === 'error') {
    setStatus('error', '协商失败'); notify('⚠️ ' + (d.message || '服务端错误'));
    return;
  }

  if (d.type === 'pong') {
    if (pingStart > 0) { latencyMs = Math.round(performance.now() - pingStart); pingStart = 0; }
    return;
  }
}

// ── WebRTC：建立 host-only PeerConnection 并接收 H.264 视频 ────────
async function startWebRtc() {
  if (pc || !ws || ws.readyState !== WebSocket.OPEN) return;
  setStatus('connecting', '建立视频连接…');
  try {
    // iceServers 为空 => 浏览器只收集 host candidate，纯 IP 直连
    pc = new RTCPeerConnection({ iceServers: [] });

    // 只接收视频：显式添加 recvonly transceiver，否则 offer 中没有 m= 段与 ICE 凭据
    pc.addTransceiver('video', { direction: 'recvonly' });

    pc.ontrack = e => {
      if (e.streams && e.streams[0]) video.srcObject = e.streams[0];
    };

    pc.oniceconnectionstatechange = () => {
      if (!pc) return;
      const st = pc.iceConnectionState;
      if (st === 'connected' || st === 'completed') {
        setStatus('connected', '已连接');
      } else if (st === 'disconnected') {
        setStatus('connecting', '连接抖动，重连中…');
      } else if (st === 'failed') {
        setStatus('error', 'ICE 连接失败');
        notify('⚠️ 直连失败：请确认在同一局域网且防火墙已放行');
      }
    };

    video.onloadedmetadata = () => {
      remoteWidth = video.videoWidth || remoteWidth;
      remoteHeight = video.videoHeight || remoteHeight;
      fitToWindow();
      activateConnection();
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    // non-trickle ICE：等收集完成再把完整 offer 发给服务端
    if (pc.iceGatheringState !== 'complete') {
      await new Promise(resolve => {
        const check = () => {
          if (!pc || pc.iceGatheringState === 'complete') {
            if (pc) pc.removeEventListener('icegatheringstatechange', check);
            resolve();
          }
        };
        pc.addEventListener('icegatheringstatechange', check);
        setTimeout(resolve, 3000);
      });
    }
    if (!pc) return;
    send({ type: 'offer', sdp: pc.localDescription.sdp });
  } catch (e) {
    setStatus('error', 'WebRTC 初始化失败');
    notify('⚠️ WebRTC 初始化失败: ' + e);
    closePeer();
  }
}

// ── 弱网自适应：基于 WebRTC getStats() 的丢包率调整码率 ────────────
async function collectRtcStats() {
  if (!pc) return;
  try {
    const stats = await pc.getStats();
    stats.forEach(r => {
      if (r.type === 'inbound-rtp' && (r.kind === 'video' || r.mediaType === 'video')) {
        const frames = r.framesDecoded || 0;
        const bytes = r.bytesReceived || 0;
        const lost = r.packetsLost || 0;
        const received = r.packetsReceived || 0;
        frameCount += Math.max(0, frames - lastRtcStats.frames);
        byteCount += Math.max(0, bytes - lastRtcStats.bytes) * 8; // bit
        lastRtcStats = { frames, bytes, lost, received };

        const now = performance.now();
        if (now - lastAdaptAt >= 3000 && received > lastRcvReceived + 30) {
          const lostDelta = Math.max(0, lost - lastRcvLost);
          const rcvDelta = Math.max(0, received - lastRcvReceived);
          lastRcvLost = lost; lastRcvReceived = received; lastAdaptAt = now;
          const lossRate = lostDelta / Math.max(1, lostDelta + rcvDelta);
          let next = targetBitrateKbps;
          if (lossRate > 0.05) {
            next = Math.max(minBitrateKbps, Math.round(targetBitrateKbps * 0.75));
            requestKeyframe();
          } else if (lossRate < 0.01) {
            next = Math.min(8000, Math.round(targetBitrateKbps * 1.15));
          }
          bitrateAtFloor = next <= minBitrateKbps && lossRate > 0.05;
          if (next !== targetBitrateKbps) {
            targetBitrateKbps = next;
            send({ type: 'adapt', bitrate_kbps: next });
          }
        } else if (received >= lastRcvReceived) {
          lastRcvLost = lost; lastRcvReceived = received;
        }
      }
    });
  } catch (e) {}
}
let lastRcvLost = 0, lastRcvReceived = 0;

// ── 缩放 / 坐标 ────────────────────────────────────────────────────
function applyZoom(z) {
  zoom = Math.max(0.1, Math.min(6, z));
  video.style.width = (remoteWidth * zoom) + 'px';
  video.style.height = (remoteHeight * zoom) + 'px';
  remoteCursor.style.width = (16 * Math.min(zoom, 2)) + 'px';
  remoteCursor.style.height = (16 * Math.min(zoom, 2)) + 'px';
}
function fitToWindow() {
  manualZoom = false;
  if (!remoteWidth || !remoteHeight) return;
  const vw = viewport.clientWidth - 2, vh = viewport.clientHeight - 2;
  applyZoom(Math.min(vw / remoteWidth, vh / remoteHeight));
}
function toRemote(clientX, clientY) {
  const r = video.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(remoteWidth - 1, Math.round((clientX - r.left) * remoteWidth / r.width))),
    y: Math.max(0, Math.min(remoteHeight - 1, Math.round((clientY - r.top) * remoteHeight / r.height)))
  };
}
function updateCursor(cx, cy) {
  const r = video.getBoundingClientRect();
  remoteCursor.style.left = (cx - r.left) + 'px';
  remoteCursor.style.top = (cy - r.top) + 'px';
}
// 点击 / 滚轮前把尚未发出的移动立即补发，避免在旧位置触发操作
function flushMove() {
  if (!pendingMove || !isConnected) { pendingMove = null; return; }
  const p = toRemote(pendingMove.x, pendingMove.y);
  send({ type: 'mousemove', x: p.x, y: p.y, button: pendingMove.button });
  pendingMove = null;
}

// ── 鼠标 / 触控笔（桌面） ──────────────────────────────────────────
wrapper.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' || !isConnected) return;
  e.preventDefault();
  flushMove();
  updateCursor(e.clientX, e.clientY);
  const p = toRemote(e.clientX, e.clientY);
  send({ type: 'mousedown', x: p.x, y: p.y, button: e.button });
  pressedButtons.add(e.button);
  wrapper.setPointerCapture(e.pointerId);
});
wrapper.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch' || !isConnected) return;
  // 本地光标立即跟随，网络发送合并到下一动画帧（高频鼠标不刷屏）
  updateCursor(e.clientX, e.clientY);
  pendingMove = { x: e.clientX, y: e.clientY, button: e.button };
  if (!moveScheduled) {
    moveScheduled = true;
    requestAnimationFrame(() => {
      moveScheduled = false;
      if (!pendingMove || !isConnected) return;
      const p = toRemote(pendingMove.x, pendingMove.y);
      send({ type: 'mousemove', x: p.x, y: p.y, button: pendingMove.button });
      pendingMove = null;
    });
  }
});
wrapper.addEventListener('pointerup', e => {
  if (e.pointerType === 'touch' || !isConnected) return;
  e.preventDefault();
  flushMove();
  pressedButtons.delete(e.button);
  const p = toRemote(e.clientX, e.clientY);
  send({ type: 'mouseup', x: p.x, y: p.y, button: e.button });
});
wrapper.addEventListener('contextmenu', e => e.preventDefault());
wrapper.addEventListener('wheel', e => {
  if (!isConnected) return;
  e.preventDefault();
  flushMove();
  const p = toRemote(e.clientX, e.clientY);
  send({ type: 'wheel', x: p.x, y: p.y, deltaX: e.deltaX, deltaY: e.deltaY });
}, { passive: false });

// ── 触屏手势 ───────────────────────────────────────────────────────
const T = {
  active: false, mode: '', startX: 0, startY: 0, lastX: 0, lastY: 0,
  startDist: 0, startZoom: 1, centerX: 0, centerY: 0, moved: false,
  longTimer: null, longFired: false, lastTap: 0, lastTapX: 0, lastTapY: 0,
  dragDown: false
};

function dist(t1, t2) { return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY); }
function center(t1, t2) { return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 }; }
function clearLongPress() { if (T.longTimer) { clearTimeout(T.longTimer); T.longTimer = null; } }

wrapper.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!isConnected) return;
  if (e.touches.length === 1) {
    const t = e.touches[0];
    T.active = true; T.mode = 'single'; T.moved = false; T.longFired = false; T.dragDown = false;
    T.startX = T.lastX = t.clientX; T.startY = T.lastY = t.clientY;
    const p = toRemote(t.clientX, t.clientY);
    send({ type: 'mousemove', x: p.x, y: p.y });
    if (touchMode === 'drag') {
      send({ type: 'mousedown', x: p.x, y: p.y, button: 0 }); T.dragDown = true;
      pressedButtons.add(0);
    } else {
      clearLongPress();
      T.longTimer = setTimeout(() => {
        if (T.active && !T.moved && e.touches.length === 1) {
          T.longFired = true; T.mode = 'longpress';
          const q = toRemote(T.lastX, T.lastY);
          send({ type: 'mousedown', x: q.x, y: q.y, button: 2 });
          send({ type: 'mouseup', x: q.x, y: q.y, button: 2 });
          notify('右键'); vibrate(35);
        }
      }, 520);
    }
  } else if (e.touches.length >= 2) {
    clearLongPress();
    if (T.dragDown) { const p = toRemote(T.lastX, T.lastY); send({ type: 'mouseup', x: p.x, y: p.y, button: 0 }); T.dragDown = false; pressedButtons.delete(0); }
    T.active = true; T.mode = 'pinch'; T.longFired = true;
    T.startDist = dist(e.touches[0], e.touches[1]) || 1;
    T.startZoom = zoom;
    const c = center(e.touches[0], e.touches[1]);
    T.centerX = c.x; T.centerY = c.y;
  }
}, { passive: false });

wrapper.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!T.active || !isConnected) return;

  if (e.touches.length >= 2 && T.mode === 'pinch') {
    const d = dist(e.touches[0], e.touches[1]) || 1;
    const c = center(e.touches[0], e.touches[1]);
    manualZoom = true;
    applyZoom(T.startZoom * (d / T.startDist));
    const dx = c.x - T.centerX, dy = c.y - T.centerY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
      // 双指平移：本地滚动视口 + 向远端发送滚轮，兼顾缩放后的浏览与真实滚动
      viewport.scrollLeft -= dx; viewport.scrollTop -= dy;
      const p = toRemote(c.x, c.y);
      send({ type: 'wheel', x: p.x, y: p.y, deltaX: -dx * 2, deltaY: -dy * 2 });
      T.centerX = c.x; T.centerY = c.y;
    }
    return;
  }

  if (e.touches.length === 1 && (T.mode === 'single' || T.mode === 'longpress')) {
    const t = e.touches[0];
    T.lastX = t.clientX; T.lastY = t.clientY;
    if (Math.hypot(t.clientX - T.startX, t.clientY - T.startY) > 10) {
      T.moved = true; clearLongPress();
    }
    const now = performance.now();
    if (now - lastMoveSent < 16) return;      // 节流，避免弱网洪泛
    lastMoveSent = now;
    const p = toRemote(t.clientX, t.clientY);
    send({ type: 'mousemove', x: p.x, y: p.y, button: T.dragDown ? 0 : 0 });
  }
}, { passive: false });

function endTouch(e) {
  e.preventDefault();
  if (!T.active) return;
  clearLongPress();
  if (T.mode === 'single' && !T.longFired && isConnected) {
    const p = toRemote(T.lastX, T.lastY);
    if (T.dragDown) {
      send({ type: 'mouseup', x: p.x, y: p.y, button: 0 });
      pressedButtons.delete(0);
    } else if (!T.moved) {
      const now = performance.now();
      const isDouble = now - T.lastTap < 320 && Math.hypot(p.x - T.lastTapX, p.y - T.lastTapY) < 40;
      const clicks = isDouble ? 2 : 1;
      for (let i = 0; i < clicks; i++) {
        send({ type: 'mousedown', x: p.x, y: p.y, button: 0 });
        send({ type: 'mouseup', x: p.x, y: p.y, button: 0 });
      }
      if (isDouble) { T.lastTap = 0; vibrate(20); }
      else { T.lastTap = now; T.lastTapX = p.x; T.lastTapY = p.y; }
    } else {
      // 单指拖动（点击模式）：仅移动光标，不产生点击
    }
  }
  T.dragDown = false;
  if (e.touches.length === 0) { T.active = false; T.mode = ''; }
  else if (e.touches.length === 1) { T.mode = 'longpress'; T.longFired = true; }
}
wrapper.addEventListener('touchend', endTouch, { passive: false });
wrapper.addEventListener('touchcancel', endTouch, { passive: false });

// ── 桌面键盘 ───────────────────────────────────────────────────────
function activeModifiers(e) {
  const m = [];
  if (e.ctrlKey) m.push('ctrl');
  if (e.altKey) m.push('alt');
  if (e.shiftKey) m.push('shift');
  if (e.metaKey) m.push('cmd');
  return m;
}
document.addEventListener('keydown', e => {
  if (!isConnected || authDialog.classList.contains('show')) return;
  if (e.target instanceof HTMLInputElement) return;
  if (e.key === 'F11') { e.preventDefault(); toggleFullscreen(); return; }
  if (e.key !== 'F5') e.preventDefault();
  send({ type: 'keydown', key: e.key, code: e.code, modifiers: activeModifiers(e) });
  pressedKeys.set(keyId(e.key, e.code), { key: e.key, code: e.code });
}, { passive: false });
document.addEventListener('keyup', e => {
  pressedKeys.delete(keyId(e.key, e.code));
  if (!isConnected || authDialog.classList.contains('show')) return;
  if (e.target instanceof HTMLInputElement) return;
  if (e.key === 'F11') return;
  e.preventDefault();
  send({ type: 'keyup', key: e.key, code: e.code, modifiers: activeModifiers(e) });
}, { passive: false });
document.addEventListener('paste', e => {
  if (!isConnected || e.target instanceof HTMLInputElement) return;
  const text = e.clipboardData?.getData('text/plain');
  if (text) send({ type: 'paste', text: text.slice(0, 2000) });
});

// ── 虚拟键盘 / 快捷键 ──────────────────────────────────────────────
const KEYS = [
  ['Esc', 'Escape'], ['Tab', 'Tab'], ['Enter', 'Enter'], ['⌫', 'Backspace'],
  ['←', 'ArrowLeft'], ['↑', 'ArrowUp'], ['↓', 'ArrowDown'], ['→', 'ArrowRight'],
  ['Ctrl+C', 'c', ['ctrl']], ['Ctrl+V', 'v', ['ctrl']], ['Ctrl+X', 'x', ['ctrl']],
  ['Ctrl+A', 'a', ['ctrl']], ['Ctrl+Z', 'z', ['ctrl']], ['Ctrl+S', 's', ['ctrl']],
  ['Alt+Tab', 'Tab', ['alt']], ['Win', 'Meta'], ['Del', 'Delete'], ['F11', 'F11']
];
const grid = $('key-grid');
KEYS.forEach(([label, key, mods]) => {
  const b = document.createElement('button');
  b.className = 'tbtn'; b.textContent = label;
  b.addEventListener('click', ev => {
    ev.preventDefault();
    if (!isConnected) { notify('尚未连接'); return; }
    send({ type: 'combo', key, modifiers: mods || [] });
    vibrate(15);
  });
  grid.appendChild(b);
});

function toggleKbdPanel(force) {
  const p = $('kbd-panel');
  const show = force !== undefined ? force : !p.classList.contains('show');
  p.classList.toggle('show', show);
  $('t-kbd').classList.toggle('on', show);
  if (show) setTimeout(() => $('kbd-hidden').focus(), 60);
}
function sendText(text) {
  if (!text || !isConnected) return;
  send({ type: 'type', text: String(text).slice(0, 2000) });
  notify('已发送文字');
}
$('t-send').addEventListener('click', () => {
  const el = $('text-input');
  if (el.value) { sendText(el.value); el.value = ''; }
});
$('text-input').addEventListener('keydown', e => { if (e.key === 'Enter') $('t-send').click(); });
$('kbd-hidden').addEventListener('input', e => {
  const v = e.target.value;
  if (v) sendText(v);
  e.target.value = '';
});
$('t-kbd').addEventListener('click', () => toggleKbdPanel());
$('t-mode').addEventListener('click', () => {
  touchMode = touchMode === 'tap' ? 'drag' : 'tap';
  const b = $('t-mode');
  b.textContent = touchMode === 'tap' ? '👆 点击' : '✊ 拖动';
  b.classList.toggle('on', touchMode === 'tap');
  notify(touchMode === 'tap' ? '单指轻点＝单击，长按＝右键' : '单指按住并拖动');
});
$('t-paste').addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    sendText(text);
  } catch (e) { notify('无法读取剪贴板，请用下方输入框'); }
});
$('t-zoom-in').addEventListener('click', () => { manualZoom = true; applyZoom(zoom * 1.25); });
$('t-zoom-out').addEventListener('click', () => { manualZoom = true; applyZoom(zoom / 1.25); });
$('t-fit').addEventListener('click', () => { fitToWindow(); viewport.scrollTo(0, 0); notify('已适应屏幕'); });

// ── 全屏 ───────────────────────────────────────────────────────────
function toggleFullscreen() {
  const el = document.documentElement;
  const fs = document.fullscreenElement || document.webkitFullscreenElement;
  if (!fs) (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
  else (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
}
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('fullscreen-mode', !!document.fullscreenElement);
  if (!manualZoom) fitToWindow();
  else applyZoom(zoom);
});
// 失焦 / 切后台时释放本端记录的全部按键，避免服务端残留按下状态
window.addEventListener('blur', releaseAllLocal);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAllLocal(); });

// ── 统计 ───────────────────────────────────────────────────────────
function activateConnection() {
  isConnected = true;
  overlay.classList.add('hidden');
  $('btn-connect').disabled = true; $('btn-disconnect').disabled = false;
  notify('连接成功 ✓'); startTimers();
}
function stopTimers() {
  clearInterval(statTimer); clearInterval(pingTimer);
  statTimer = pingTimer = null;
  frameCount = byteCount = 0; latencyMs = 0; pingStart = 0;
  $('stat-fps').textContent = 'FPS: -'; $('stat-tiles').textContent = 'Tiles: -';
  $('stat-bw').textContent = 'BW: -'; $('stat-latency').textContent = '延迟: -';
}
function startTimers() {
  stopTimers(); lastStatTime = performance.now();
  pingTimer = setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN && pingStart === 0) {
      pingStart = performance.now();
      // 附带当前真实按下的键与鼠标键，服务端据此释放残留按键
      send({
        type: 'ping',
        keys: [...pressedKeys.values()],
        buttons: [...pressedButtons]
      });
    }
  }, 1000);
  statTimer = setInterval(() => {
    const now = performance.now(), dt = Math.max(0.001, (now - lastStatTime) / 1000);
    lastStatTime = now;
    collectRtcStats();
    $('stat-fps').textContent = 'FPS: ' + (frameCount / dt).toFixed(1);
    $('stat-tiles').textContent = '目标: ' + targetBitrateKbps + 'kbps'
      + (bitrateAtFloor ? ' (已触底)' : '');
    $('stat-bw').textContent = 'BW: ' + (byteCount / dt / 1024).toFixed(0) + 'KB/s';
    $('stat-latency').textContent = '延迟: ' + latencyMs + 'ms';
    frameCount = byteCount = 0;
  }, 1000);
}

// ── 初始化 ─────────────────────────────────────────────────────────
$('btn-connect').addEventListener('click', connect);
$('btn-disconnect').addEventListener('click', disconnect);
$('btn-refresh').addEventListener('click', () => { requestKeyframe(); notify('已请求关键帧刷新'); });
$('btn-fullscreen').addEventListener('click', toggleFullscreen);
$('auth-submit').addEventListener('click', submitAuth);
$('auth-cancel').addEventListener('click', () => { authDialog.classList.remove('show'); disconnect(); });
authPassword.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitAuth(); } });

window.addEventListener('resize', () => { if (!manualZoom) fitToWindow(); });
window.addEventListener('orientationchange', () => setTimeout(() => { if (!manualZoom) fitToWindow(); }, 250));

video.width = 1920; video.height = 1080;

setTimeout(connect, 60);
</script>
</body>
